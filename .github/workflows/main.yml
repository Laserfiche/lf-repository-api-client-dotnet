name: lf-repository-api-client-dotnet-CI

on:
  push:
    # Trigger on every branch push so feature branches can publish per-branch preview
    # NuGet packages without first deploying the server. The publish job below restricts
    # production publishes to the `v2` branch; preview-publish runs on all branches with
    # a branch-aware version suffix. See:
    #   site-api-repository/docs/design-server-client-preview-nuget-workflow.md
    branches:
      - '**'
  pull_request:
    branches:
      - v2
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  API_VERSION: 'v2'
  VERSION_PREFIX: '2.3.0'
  GITHUB_PAGES_BRANCH: 'gh-pages'

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Run unit tests
      run: dotnet test tests/unit/Laserfiche.Repository.Api.Client.Test.csproj --no-build --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

    - name: Unit Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()    # run this step even if previous step failed
      with:
        name: Unit Test Results
        path: '**/unit-test-results.trx'
        reporter: dotnet-trx
        only-summary: 'false'
        list-tests: 'failed'
        fail-on-error: 'false'

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests hit the shared dev-CA cloud repo and are validated locally as part of
    # the per-phase client-lib workflow. CI therefore runs them only where they add value
    # without contention: on pull requests (a NON-blocking signal — keep this check OUT of the
    # v2 required-status-checks list) and on any re-run, which is the publish path. The publish
    # jobs below depend on this job, so no package ships to NuGet.org unless integration passed.
    # First-attempt branch pushes skip integration, which removes the push+PR double-run that
    # drove the shared dev-CA flakiness (work item #671227).
    if: ${{ github.event_name == 'pull_request' || github.run_attempt != 1 }}
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Run integration tests
      env:
        ACCESS_KEY: ${{ secrets.DEV_CA_PUBLIC_USE_INTEGRATION_TEST_ACCESS_KEY }}
        SERVICE_PRINCIPAL_KEY:  ${{ secrets.DEV_CA_PUBLIC_USE_TESTOAUTHSERVICEPRINCIPAL_SERVICE_PRINCIPAL_KEY }}
        REPOSITORY_ID:  ${{ secrets.DEV_CA_PUBLIC_USE_REPOSITORY_ID_1 }}
        AUTHORIZATION_TYPE: ${{ secrets.AUTHORIZATION_TYPE }}
        TEST_HEADER: ${{ secrets.TEST_HEADER }}
      run:
        dotnet test tests/integration/Laserfiche.Repository.Api.Client.IntegrationTest.csproj --no-build --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Integration Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()    # run this step even if previous step failed
      with:
        name: Integration Test Results
        path: '**/integration-test-results.trx'
        reporter: dotnet-trx
        only-summary: 'false'
        list-tests: 'failed'
        fail-on-error: 'false'

  build-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ build-n-test ] # wait for build to finish
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get install doxygen
        sudo apt-get install graphviz

    - name: Check dependency versions
      run: |
        doxygen --version
        dot -V

    - name: Create temporary directory
      run: mkdir -p ./generated_documentation/

    - name: Rewrite doxygen config
      run: |
        sed -i 's|PROJECT_NUMBER         = version|PROJECT_NUMBER         = ${{ env.VERSION_PREFIX }}|i' ./doxygen/doxygen.conf

    - name: Dump doxygen.conf to check rewrite
      run: head -n 200 ./doxygen/doxygen.conf

    - name: Generate doxygen docs
      run: doxygen ./doxygen/doxygen.conf

    - name: Upload a build artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation-artifact
        path: ${{ github.workspace }}/generated_documentation/html

    - name: Delete temporary directory
      run: rm -r ./generated_documentation


  publish-preview-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    if: ${{ github.run_attempt != 1 }}
    needs: [ build-n-test, build-documentation, integration-test ] # wait for build + integration to finish
    permissions:
      id-token: write   # request the OIDC token for NuGet Trusted Publishing
      contents: write   # the "Tag commit" step pushes a tag on the v2 branch
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration release

    - name: Set PACKAGE_VERSION environment
      # `v2` keeps the historical `${VERSION_PREFIX}-beta-${run_id}` shape. Feature branches
      # get a `${VERSION_PREFIX}-feature-${branch_slug}-${run_id}` suffix so previews from
      # different branches don't collide on the NuGet feed and the source branch is visible
      # in the version string.
      #
      # Branch slug must be a valid SemVer prerelease identifier ([0-9A-Za-z-] only). Git
      # allows characters NuGet/SemVer reject (`_ . / @ + ~ ...`), so map every non-allowed
      # char to `-`, then collapse runs and trim leading/trailing `-`.
      run: |
        if [ "$GITHUB_REF_NAME" = "v2" ]; then
          echo "PACKAGE_VERSION=${{ env.VERSION_PREFIX }}-beta-${{ github.run_id }}" >> $GITHUB_ENV
        else
          BRANCH_SLUG=$(echo "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')
          echo "PACKAGE_VERSION=${{ env.VERSION_PREFIX }}-feature-${BRANCH_SLUG}-${{ github.run_id }}" >> $GITHUB_ENV
        fi

    - name: Packaging
      run: dotnet pack --no-build --configuration release /p:version=${{ env.PACKAGE_VERSION }}

    # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1 hour)
    # nuget.org API key. Requested immediately before the push so it doesn't expire.
    # No long-lived NUGET_KEY secret required. See:
    #   https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to nuget.org
      run: dotnet nuget push ./src/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

    - name: Tag commit
      # Only tag `v2`-branch previews. Feature-branch previews are short-lived and tagging
      # each one would clutter the repo.
      if: github.ref_name == 'v2'
      uses: rickstaa/action-create-tag@v1
      with:
        tag: ${{ env.API_VERSION }}-${{ env.PACKAGE_VERSION }}
        commit_sha: ${{ github.sha }}
        message: Workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


  publish-production-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Production publish is `v2`-branch only. The `run_attempt != 1` gate keeps the
    # re-run-to-publish convention; feature branches never reach this job.
    if: ${{ github.run_attempt != 1 && github.ref_name == 'v2' }}
    needs: [ build-n-test, build-documentation, integration-test ] # wait for build + integration to finish
    permissions:
      id-token: write   # request the OIDC token for NuGet Trusted Publishing
      contents: write   # the "Tag commit" step pushes a tag on the v2 branch
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration release

    - name: Set PACKAGE_VERSION environment
      run: echo "PACKAGE_VERSION=${{ env.VERSION_PREFIX }}" >> $GITHUB_ENV

    - name: Packaging
      run: dotnet pack --no-build --configuration release /p:version=${{ env.PACKAGE_VERSION }}

    # Trusted Publishing: exchange the GitHub OIDC token for a short-lived (1 hour)
    # nuget.org API key. Requested immediately before the push so it doesn't expire.
    # No long-lived NUGET_KEY secret required. See:
    #   https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to nuget.org
      run: dotnet nuget push ./src/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

    - name: Tag commit
      uses: rickstaa/action-create-tag@v1
      with:
        tag: ${{ env.API_VERSION }}-${{ env.PACKAGE_VERSION }}
        commit_sha: ${{ github.sha }}
        message: Workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


  publish-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    needs: [ publish-production-package ]
    permissions:
      contents: write   # peter-evans/create-pull-request needs to push the docs branch
    steps:
    - name: Set DOCUMENTATION_VERSION environment variable
      run: |
        version_prefix=${{ env.VERSION_PREFIX }}
        major_version=${version_prefix%%.*}
        documentation_version=$major_version.x
        echo $documentation_version
        echo DOCUMENTATION_VERSION=$documentation_version >> $GITHUB_ENV

    - name: Print DOCUMENTATION_VERSION environment variable
      run: |
        echo 'Publishing documentation to ${{ env.GITHUB_PAGES_BRANCH }} for ${{ env.API_VERSION }} ${{ env.DOCUMENTATION_VERSION }}.'
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.GITHUB_PAGES_BRANCH }}

    - name: Delete documentation directory
      run: rm -f -r ./docs/${{ env.API_VERSION }}/${{ env.DOCUMENTATION_VERSION }}

    - name: Create documentation directory
      run: mkdir -p ./docs/${{ env.API_VERSION }}/${{ env.DOCUMENTATION_VERSION }}

    - name: Download documentation build artifact
      uses: actions/download-artifact@v4
      with:
        name: documentation-artifact
        path: ./docs/${{ env.API_VERSION }}/${{ env.DOCUMENTATION_VERSION }}

    - name: Create a pull request
      uses: peter-evans/create-pull-request@v4
      with:
        branch: ${{ env.GITHUB_PAGES_BRANCH }}-${{ env.API_VERSION }}-${{ env.DOCUMENTATION_VERSION }}-patch
        delete-branch: true
        title: "Automated documentation update for ${{ env.API_VERSION }} ${{ env.DOCUMENTATION_VERSION }} by action ${{ github.run_id }}"
        commit-message: "Automated documentation update for ${{ env.API_VERSION }} ${{ env.DOCUMENTATION_VERSION }} by action ${{ github.run_id }}"
        body: "Automated documentation update for ${{ env.API_VERSION }} ${{ env.DOCUMENTATION_VERSION }} by action ${{ github.run_id }}"
        assignees: ${{ github.actor }}